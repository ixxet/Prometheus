---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: apollo
spec:
  template:
    spec:
      initContainers:
      - name: apollo-migrate
        image: ghcr.io/ixxet/apollo:sha-3bfbbe9@sha256:20cac036d6bdf31c7fc8b84b9a964ce2facdf1db8b2e174d9d8db37c72c94de6
      containers:
      - name: apollo
        image: ghcr.io/ixxet/apollo:sha-3bfbbe9@sha256:20cac036d6bdf31c7fc8b84b9a964ce2facdf1db8b2e174d9d8db37c72c94de6
        env:
        - name: APOLLO_SESSION_COOKIE_NAME
          value: apollo_session
        - name: APOLLO_SESSION_COOKIE_SECURE
          value: 'true'
        - name: APOLLO_LOG_VERIFICATION_TOKENS
          value: 'false'
        - name: APOLLO_TRUSTED_SURFACES
          valueFrom:
            secretKeyRef:
              name: ashton-booking-surface
              key: apollo-trusted-surfaces
        - name: APOLLO_SMTP_HOST
          valueFrom:
            configMapKeyRef:
              name: ashton-booking-mail
              key: host
        - name: APOLLO_SMTP_FROM
          valueFrom:
            configMapKeyRef:
              name: ashton-booking-mail
              key: from
        - name: APOLLO_SMTP_TLS_MODE
          value: starttls
        - name: APOLLO_SMTP_PORT
          value: '587'
        - name: APOLLO_SMTP_TIMEOUT
          value: 4s
        - name: APOLLO_SMTP_USERNAME
          valueFrom:
            secretKeyRef:
              name: apollo-smtp
              key: username
        - name: APOLLO_SMTP_PASSWORD
          valueFrom:
            secretKeyRef:
              name: apollo-smtp
              key: password
