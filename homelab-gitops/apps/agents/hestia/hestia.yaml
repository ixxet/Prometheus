---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hestia
  namespace: agents
  labels:
    app.kubernetes.io/name: hestia
    app.kubernetes.io/part-of: ashton
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: hestia
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hestia
        app.kubernetes.io/part-of: ashton
    spec:
      serviceAccountName: agents-ghcr
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: hestia
        image: ghcr.io/ixxet/hestia:sha-f9bbca0@sha256:f44b50520d0066c9a9dba1e539c8d2d92a700cdd500f5349fd1a6881df097931
        ports:
        - name: http
          containerPort: 3000
        env:
        - name: HOST
          value: 0.0.0.0
        - name: PORT
          value: '3000'
        - name: ORIGIN
          value: https://book.lintellabs.net
        - name: APOLLO_ORIGIN
          value: http://apollo.agents.svc.cluster.local
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        readinessProbe:
          httpGet:
            path: "/_app/version.json"
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: "/_app/version.json"
            port: http
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: hestia
  namespace: agents
  labels:
    app.kubernetes.io/name: hestia
    app.kubernetes.io/part-of: ashton
spec:
  selector:
    app.kubernetes.io/name: hestia
  ports:
  - name: http
    port: 80
    targetPort: http
